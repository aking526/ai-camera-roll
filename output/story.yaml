background: 'Maya Chen is 24 at the start of this year, a second-year Master of Architecture student at
  Temple University in Philadelphia. She lives on the third floor of a narrow walk-up on Susquehanna Avenue
  in Fishtown with her roommate Priya, a night-shift nurse who leaves cryptic notes on the fridge. Maya
  has dark hair she usually tucks under a faded green cap with a mountain patch, wire-rimmed glasses,
  and fingers often stained with graphite or model glue. She is patient, observant, and quietly stubborn,
  with a habit of narrating buildings to herself as she passes them. She works part-time at a bakery on
  Girard and picks up occasional hours in the architecture model shop. On weekends she rides an old blue
  Schwinn along the Schuylkill, sketches rowhouses in a black hardcover sketchbook, and cooks big, unfussy
  meals for friends. Her people include Priya; Jonah, a classmate who shares her studio desk; and her
  older brother Eli, who lives in Chicago. Her possessions are modest but specific: the green cap, the
  blue bike, the sketchbook, a cast-iron skillet inherited from her grandmother, and a chipped blue mug
  she refuses to replace.'
years:
- year: 1
  narrative: 'Year 1 begins in January, when Philadelphia is gray and salt-stained. Maya is 24, and her
    days settle into a winter rhythm: bakery shifts before dawn, studio until late, the blue Schwinn parked
    in the hallway because the basement lock freezes. She wears the green cap under her bike helmet on
    weekends, riding to Penn Treaty Park and back, then sketching rowhouse cornices with numb fingers.
    In February, she cooks a pot of braised white beans and cornbread in the cast-iron skillet for Priya
    and Jonah; they eat at the coffee table because the kitchen table is covered in chipboard models.
    March brings midterms and a bike tune-up—new brake pads, a grease smudge on the cap''s brim that she
    tries, and fails, to wash out. Spring studio focuses on adaptive reuse of a corner store on Front
    Street. She visits the site at different hours, photographing light on the brick, and fills half a
    sketchbook. In May, after final review, she celebrates with a long ride to Manayunk and a quiet beer
    with Jonah. Summer is hot and slower. She interns at a small firm in Center City, commuting by bike
    in the early cool, keeping the chipped blue mug on her desk. Evenings are for cold sesame noodles,
    porch dinners with Priya, and dusk rides along the river. In August she turns 25 and marks it with
    a picnic at Penn Treaty Park; Priya brings a cake, Jonah brings a frisbee, and Maya wears the green
    cap the whole time. Fall returns her to studio. She sketches under streetlights on Frankford Avenue,
    cooks chili for a crowd in October, and rides through November''s bare trees. By December she is tired
    but steady, the cap more faded, the sketchbook nearly full, the blue bike leaning against the hallway
    wall like a patient friend.'
seed: Maya is a 24-year-old architecture student in Philadelphia. She loves weekend bike rides, cooking
  for friends, and sketching neighborhood buildings. She wears a faded green cap with a mountain patch.
